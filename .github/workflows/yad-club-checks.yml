name: YAD Club checks
on:
  pull_request:
    paths:
      - 'api/club*.js'
      - 'lib/yad-club*.js'
      - 'tests/club.test.js'
      - 'tests/campaign.test.js'
      - 'api/admin.js'
      - 'club-promos-admin.js'
      - 'migrations/20261106_yad_campaign_drafts.sql'
      - 'package.json'
      - '.github/workflows/yad-club-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install production dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run Club security tests
        run: npm test
