name: Publish YAD catalog photographs

on:
  push:
    paths:
      - ".github/workflows/yad-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current YAD main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check pillow numpy
      - name: Build and validate all six volumes
        run: python scripts/build_catalog_images.py
      - name: Check original product images present
        run: |
          test "$(find assets/studio -name '*.webp' | wc -l)" -eq 414
          test -s assets/studio/manifest.json
          echo "414 photo composites ready"
      - name: Commit product image assets to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/studio
          if ! git diff --cached --quiet; then
            git commit -m "Publish 414 verified YAD bottle-label photo assets"
            git push origin HEAD:main
          fi
