name: YAD marketing checks
on:
  pull_request:
    paths:
      - 'api/admin.js'
      - 'admin.html'
      - 'campaigns-admin.js'
      - 'migrations/20261106_yad_campaign_drafts.sql'
      - 'tests/campaign.test.js'
      - 'tests/campaign-publish.test.js'
      - 'api/campaign.js'
      - 'campaigns-public.js'
      - 'campaigns.css'
      - 'migrations/20261106_yad_campaign_publication.sql'
      - '.github/workflows/yad-marketing-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-campaign-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify campaign authorization and concurrency
        run: node --test tests/campaign.test.js tests/campaign-publish.test.js
