name: YAD automated flacon photos
on:
  pull_request:
    paths:
      - 'catalog-data.js'
      - 'app.js'
      - 'api/yad-flacon.js'
      - 'lib/yad-flacon-renderer.js'
      - 'tests/yad-flacon.test.js'
      - 'package.json'
      - '.github/workflows/yad-flacon-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  six-bottle-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install production dependencies
        run: npm install --no-audit --no-fund
      - name: Verify catalog and flacon code syntax
        run: node --check app.js && node --check catalog-data.js && node --check lib/yad-flacon-renderer.js
      - name: Test automated six-size YAD bottle imagery
        run: node --test tests/yad-flacon.test.js tests/bibliotheque.test.js
