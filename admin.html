<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>YAD · Заказы</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#101211;color:#f1eee8}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:24px 18px 70px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #303330;padding-bottom:22px;margin-bottom:32px}.logo{font:500 28px Georgia,serif;letter-spacing:.18em}.muted{color:#9e9f99;font-size:13px}h1{font:400 clamp(30px,5vw,48px) Georgia,serif;margin:0 0 8px}.login{max-width:400px;margin:12vh auto}.login input{margin:22px 0 12px}input,select,button{font:inherit}input{width:100%;padding:16px;border:1px solid #4a4b47;background:#191b19;border-radius:8px;color:#fff;font-size:16px}button{cursor:pointer;border:1px solid #555a55;background:#262a26;color:#f5f2ed;border-radius:8px;padding:11px 16px}button.primary{background:#e9e5dc;color:#171918;border-color:#e9e5dc;font-weight:600;width:100%;padding:15px}button:disabled{opacity:.5;cursor:wait}button:hover{border-color:#b5a995}.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:24px 0}.orders{display:grid;gap:12px}.order{border:1px solid #363a36;background:#191c19;border-radius:12px;padding:18px}.order-top{display:flex;align-items:start;justify-content:space-between;gap:14px}.order-id{font-weight:700;letter-spacing:.03em}.total{font-size:22px;font-weight:600;white-space:nowrap}.details{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.details small{display:block;color:#a3a59e;margin-bottom:5px}.details div{overflow-wrap:anywhere}.order select{width:100%;background:#292d29;color:#f1eee8;border:1px solid #555;border-radius:7px;padding:11px;margin-top:14px;font-size:15px}.items{border-top:1px solid #363a36;margin-top:16px;padding-top:14px;color:#d3d3cb;font-size:14px;line-height:1.7}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}.metric{padding:17px;border:1px solid #353934;border-radius:10px;background:#1b1e1b}.metric strong{display:block;font-size:23px;margin-top:8px}.controls{display:flex;gap:10px;margin:16px 0 24px}.controls input{flex:2;min-width:0}.controls select{flex:1;min-width:125px;background:#191b19;border:1px solid #4a4b47;border-radius:8px;color:#fff;padding:12px}.contact-link{display:inline-flex;margin-top:8px;padding:9px 12px;border:1px solid #777b73;border-radius:7px;color:#eae7de;text-decoration:none;font-size:13px}.contact-link:hover{background:#353a34}.error{color:#e5a9a4}.success{color:#a7c5a8}[hidden]{display:none!important}@media(max-width:550px){.metrics{grid-template-columns:repeat(2,1fr)}.controls{flex-direction:column}.details{grid-template-columns:1fr}.order{padding:16px}.toolbar{align-items:stretch}.toolbar button{flex:1}}</style></head>
<body><main><header><div class="logo">YAD</div><button id="logout" hidden>Выйти</button></header><section id="login" class="login"><h1>Управление заказами</h1><p class="muted">Закрытая панель YAD</p><form id="loginForm"><input type="password" id="password" autocomplete="current-password" placeholder="Пароль администратора" required minlength="12"><button class="primary" type="submit">Войти</button></form><p id="loginStatus" class="error" role="status"></p></section>
<section id="dashboard" hidden><h1>Заказы</h1><p class="muted">Последние 100 заявок · только для администратора</p><div class="metrics"><div class="metric"><span class="muted">Сегодня · заказы</span><strong id="todayCount">0</strong></div><div class="metric"><span class="muted">Сегодня · сумма</span><strong id="todaySum">0 ₽</strong></div><div class="metric"><span class="muted">За 7 дней · сумма</span><strong id="weekSum">0 ₽</strong></div></div><div class="toolbar"><span id="summary" class="muted"></span><button id="refresh">Обновить</button></div><div class="controls"><input id="searchOrders" type="search" placeholder="Номер, имя, контакт, адрес" aria-label="Поиск заказов"><select id="filterStatus" aria-label="Фильтр по статусу"><option value="all">Все статусы</option><option value="new">Новые</option><option value="confirmed">Подтверждённые</option><option value="processing">В работе</option><option value="shipped">Отправленные</option><option value="completed">Завершённые</option><option value="cancelled">Отменённые</option></select></div><p id="message" role="status"></p><div id="orders" class="orders"></div></section></main>
<script>
const $=id=>document.getElementById(id);const statusLabels={new:'Новый',confirmed:'Подтверждён',processing:'В работе',shipped:'Отправлен',completed:'Завершён',cancelled:'Отменён'};const money=n=>new Intl.NumberFormat('ru-RU').format(n)+' ₽';const date=s=>new Date(s).toLocaleString('ru-RU',{dateStyle:'medium',timeStyle:'short',timeZone:'Europe/Moscow'});const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function request(url,options={}){const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...options});const data=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(data.error||'Ошибка сервера'),{status:r.status});return data}
function showDashboard(on){$('login').hidden=on;$('dashboard').hidden=!on;$('logout').hidden=!on}
let cachedOrders=[];
function contactLink(o){const c=String(o.contact_value||'').trim();if(o.contact_method==='telegram'&&/^@[A-Za-z0-9_]{5,32}$/.test(c))return 'https://t.me/'+c.slice(1);if(o.contact_method==='whatsapp'){const digits=c.replace(/\D/g,'');if(digits.length>=10&&digits.length<=15)return 'https://wa.me/'+digits}return ''}
function renderOrders(){const q=$('searchOrders').value.trim().toLowerCase(),filter=$('filterStatus').value;const orders=cachedOrders.filter(o=>(filter==='all'||o.status===filter)&&(!q||[o.public_id,o.customer_name,o.contact_value,o.pickup_address].some(x=>String(x||'').toLowerCase().includes(q))));$('summary').textContent=orders.length+' из '+cachedOrders.length+' заказов · новых: '+cachedOrders.filter(o=>o.status==='new').length;
const now=Date.now(),today=new Date().toLocaleDateString('en-CA',{timeZone:'Europe/Moscow'});const active=cachedOrders.filter(o=>o.status!=='cancelled');const day=active.filter(o=>new Date(o.created_at).toLocaleDateString('en-CA',{timeZone:'Europe/Moscow'})===today),week=active.filter(o=>now-new Date(o.created_at).getTime()<=7*86400000);$('todayCount').textContent=day.length;$('todaySum').textContent=money(day.reduce((a,o)=>a+o.total_rub,0));$('weekSum').textContent=money(week.reduce((a,o)=>a+o.total_rub,0));
$('orders').innerHTML=orders.length?orders.map(o=>`<article class="order"><div class="order-top"><div><div class="order-id">№${safe(o.public_id.slice(0,8).toUpperCase())}</div><div class="muted">${safe(date(o.created_at))}</div></div><div class="total">${money(o.total_rub)}</div></div><div class="details"><div><small>Покупатель</small>${safe(o.customer_name)}</div><div><small>Связь · ${safe(o.contact_method)}</small>${safe(o.contact_value)}${contactLink(o)?`<div><a class="contact-link" target="_blank" rel="noopener noreferrer" href="${safe(contactLink(o))}">Связаться ↗</a></div>`:''}</div><div><small>Доставка</small>${safe(o.delivery_service)} · ${safe(o.pickup_address)}</div><div><small>Комментарий</small>${safe(o.comment||'—')}</div></div><div class="items">${(Array.isArray(o.items)?o.items:[]).map(i=>safe(i.title||i.id)+' · '+(i.ml?i.ml+' мл · ':'')+safe(i.qty)+' шт.').join('<br>')}</div><select data-id="${safe(o.public_id)}" aria-label="Статус заказа ${safe(o.public_id.slice(0,8))}">${Object.entries(statusLabels).map(([k,v])=>`<option value="${k}" ${o.status===k?'selected':''}>${v}</option>`).join('')}</select></article>`).join(''):'<p class="muted">Заказы не найдены.</p>'}
async function load(){try{const data=await request('/api/admin');showDashboard(true);$('message').textContent='';cachedOrders=data.orders||[];renderOrders();}catch(e){if(e.status===401||e.status===503){showDashboard(false);$('loginStatus').textContent=e.status===503?'Панель пока не активирована. Настройте ADMIN_PASSWORD и ADMIN_SESSION_SECRET в Vercel.':''}else{$('message').textContent=e.message;$('message').className='error'}}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;$('loginStatus').textContent='';try{await request('/api/admin?action=login',{method:'POST',body:JSON.stringify({password:$('password').value})});$('password').value='';await load()}catch(err){$('loginStatus').textContent=err.message}finally{b.disabled=false}});
$('orders').addEventListener('change',async e=>{const el=e.target.closest('select[data-id]');if(!el)return;el.disabled=true;$('message').textContent='';try{await request('/api/admin',{method:'PATCH',body:JSON.stringify({id:el.dataset.id,status:el.value})});$('message').textContent='Статус обновлён';$('message').className='success';await load()}catch(err){$('message').textContent=err.message;$('message').className='error';await load()}finally{el.disabled=false}});
$('searchOrders').addEventListener('input',renderOrders);$('filterStatus').addEventListener('change',renderOrders);$('refresh').addEventListener('click',load);$('logout').addEventListener('click',async()=>{await request('/api/admin?action=logout',{method:'POST'});showDashboard(false)});load();
</script></body></html>
