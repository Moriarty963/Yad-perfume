<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Отключить рассылку · YAD Club</title><style>*{box-sizing:border-box}body{margin:0;background:#faf9f6;color:#302b25;font:14px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.page{min-height:100vh;display:grid;place-items:center;padding:26px}.sheet{background:#fff;border:1px solid #e6dfd6;padding:clamp(24px,5vw,45px);width:min(100%,540px);box-shadow:0 20px 70px #28221d0b}.overline{letter-spacing:.19em;font-size:10px;color:#92816f}h1{font:400 36px/1.2 Georgia,serif;margin:14px 0 16px}p{color:#766b60}.primary{display:block;width:100%;padding:15px;background:#302b25;color:#fff;border:0;cursor:pointer;min-height:48px;margin:24px 0 15px}.primary:disabled{opacity:.45;cursor:not-allowed}a{color:#57493c}.status{min-height:25px;color:#416543;font-size:13px}.status.error{color:#a0443a}.subtle{font-size:12px;color:#9c8e81}</style></head><body><main class="page"><div class="sheet"><span class="overline">YAD / PERFUME ATELIER</span><h1>Управление рассылкой</h1><p>Вы можете отключить рекламные письма YAD Club одним нажатием. Ваш аккаунт и оформленные заказы сохранятся.</p><button type="button" class="primary" id="unsubscribe" disabled>Отключить рекламные письма</button><p class="status" id="status" role="status">Проверяем ссылку…</p><p class="subtle">Если ссылка устарела, войдите в <a href="/account">личный кабинет YAD</a> и отключите подписку в настройках.</p><a href="/">Вернуться в магазин YAD</a></div></main><script>(function(){'use strict';const b=document.getElementById('unsubscribe'),s=document.getElementById('status');const token=new URLSearchParams(location.search).get('token')||'';function status(t,e){s.textContent=t;s.classList.toggle('error',!!e)}if(!/^v1\.[0-9a-f-]{36}\.[0-9]{10}\.[a-f0-9]{64}$/.test(token)){status('Недействительная ссылка для отписки.',true);return}fetch('/api/club-unsubscribe?token='+encodeURIComponent(token),{credentials:'omit',cache:'no-store'}).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Не удалось проверить ссылку.');b.disabled=false;status('Ссылка подтверждена. Нажмите кнопку, чтобы отключить рекламу.')}).catch(e=>status(e.message,true));b.addEventListener('click',async()=>{b.disabled=true;status('Обрабатываем запрос…');try{const r=await fetch('/api/club-unsubscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token}),credentials:'omit'});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Ошибка отписки.');status('Готово: рекламные письма YAD Club отключены.');b.textContent='Подписка отключена';history.replaceState(null,'','/unsubscribe')}catch(e){status(e.message,true);b.disabled=false}})})()</script></body></html>
